<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title>ICAS Manipal — Student Life Assistant</title>
    <meta
      name="description"
      content="Student Life Assistant for ICAS Manipal: transfer guidance, academic planning, an AI assistant and administration tools for the 2+2 international transfer program."
    />
    <meta name="theme-color" content="#c2410c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="ICAS Manipal — Student Life Assistant" />
    <meta
      property="og:description"
      content="Transfer guidance, academic planning and AI tools for ICAS Manipal students and staff."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ICAS Manipal" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ICAS Manipal — Student Life Assistant" />
    <meta
      name="twitter:description"
      content="Transfer guidance, academic planning and AI tools for ICAS Manipal students and staff."
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t
            ? t === "dark"
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
